<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"

    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="./offline.css" />
    <title>dockit is offline</title>
  </head>
  <body>
    <main class="offline">
      <h1>You are offline</h1>
      <p>This page was not stored on this device, so dockit cannot show it without a connection.</p>
      <p>
        The application shell is stored and works offline:
        <a href="./">open dockit</a>.
      </p>
      <p class="muted">dockit, Airplane Mode Labs. Nothing was sent anywhere.</p>
    </main>
  </body>
</html>
