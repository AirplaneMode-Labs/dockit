name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
      # Playwright uses the preinstalled Google Chrome (channel "chrome"); no browser download.
      # Configured, not yet executed: this has not run on GitHub.
      - name: Check the preinstalled Google Chrome (Linux only)
        if: runner.os == 'Linux'
        run: google-chrome --version || { echo "Google Chrome is not installed on this runner" >&2; exit 1; }
      - if: runner.os == 'Linux'
        run: npm run test:browser
